<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Akash Anand Maurya — aspiring full-stack developer</title>
  <desc id="desc">A minimal neon-terminal profile header with a violet and cyan accent line, a terminal prompt, and a full-stack developer tagline.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A5FF"/><stop offset="0.55" stop-color="#78E8F2"/><stop offset="1" stop-color="#B8F7D4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#5D6379" stroke-opacity="0.12" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#F6F7FB"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="296" rx="22" fill="none" stroke="#5D6379" stroke-opacity="0.25"/>
  <rect x="0" y="0" width="1200" height="5" rx="2.5" fill="url(#accent)"/>
  <g transform="translate(62,55)">
    <rect width="1076" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.72" stroke="#5D6379" stroke-opacity="0.28"/>
    <circle cx="30" cy="29" r="5.5" fill="#FF7B8B"/><circle cx="49" cy="29" r="5.5" fill="#FFD166"/><circle cx="68" cy="29" r="5.5" fill="#B8F7D4"/>
    <path d="M 28 52 H 1048" stroke="#5D6379" stroke-opacity="0.2"/>
    <text x="34" y="91" fill="#78E8F2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">~/profile $ whoami</text>
    <text x="34" y="139" fill="#171827" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="39" font-weight="700">Akash Anand Maurya</text>
    <text x="36" y="170" fill="#5D6379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CSE  /  ASPIRING FULL-STACK DEVELOPER</text>
    <rect x="914" y="122" width="94" height="36" rx="8" fill="#B9A5FF" fill-opacity="0.15" stroke="#B9A5FF" stroke-opacity="0.7"/>
    <text x="961" y="145" text-anchor="middle" fill="#B9A5FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BUILD / LEARN</text>
  </g>
</svg>